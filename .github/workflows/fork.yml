name: Fork build and release

# Every push to master builds a signed release APK and publishes it as the latest GitHub
# release. The app's updater reads this repo's releases, so the TV updates itself from here.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          # "+code" is the structured tag GitHubReleaseChecker parses into a versionCode.
          echo "tag=v$VERSION_NAME+$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Unit tests of the touched modules
        run: >
          ./gradlew --console=plain
          :domain:test :data:testDebugUnitTest :core:ui:testDebugUnitTest
          :feature:live:testDebugUnitTest :feature:playback:testDebugUnitTest

      - name: Prepare signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # An unsigned APK cannot be installed, so a missing secret is a hard failure.
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets missing: run tools/setup-fork-signing.sh once."
            exit 1
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          printf '%s\n' \
            'storeFile=keystore/release.jks' \
            "storePassword=$RELEASE_STORE_PASSWORD" \
            "keyAlias=$RELEASE_KEY_ALIAS" \
            "keyPassword=$RELEASE_KEY_PASSWORD" \
            > keystore.properties

      - name: Build release APK
        run: ./gradlew --console=plain :app:assembleRelease -PforkVersionCode=${{ steps.version.outputs.code }}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "::error::No APK produced"; exit 1; }
          cp "$APK" StreamVault.apk
          gh release create "${{ steps.version.outputs.tag }}" StreamVault.apk \
            --title "StreamVault fork ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
